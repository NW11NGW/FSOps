name: CI

# `develop` is where V2 work happens, so it gets the same test run as main - a long-lived branch
# with no CI is a branch whose breakages are all discovered at merge time, in a batch, by whoever
# opens the pull request. The slower Installer and Release workflows deliberately stay on main
# only: they publish self-contained builds and are far too expensive to run on every push to a
# working branch.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-and-test:
    # Windows, not Linux: FSOps.Sim references SimConnect's native x64 libraries and the
    # net461-targeted FsConnect wrapper, so the solution does not restore on a Linux runner.
    # This is also the platform the app actually ships on, which makes it the honest place
    # to run the tests.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # Blocking, and first, so it fails in seconds rather than after a full build. It refuses a
      # commit carrying something the repository should not contain - a stray file in the root,
      # build output, a database, a credential, or a reference to local-only tooling. That last
      # category is why this blocks rather than warns: the repository is public, and a warning on a
      # green run is a warning nobody reads.
      - name: Repository hygiene
        shell: pwsh
        run: ./scripts/repo-hygiene.ps1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # Node 24, matching the version this project is developed on. Not arbitrary: jsdom's bundled
      # undici calls webidl.util.markAsUncloneable, which does not exist on Node 20, so the whole
      # Vitest run dies at import with zero tests executed rather than failing a test. Keep this in
      # step with the development Node — a CI that runs on a different runtime than anyone develops
      # on tests something nobody ships.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/fsops-web/package-lock.json

      - name: Restore
        run: dotnet restore FSOps.sln

      # Warnings are treated as failures deliberately: the project keeps a warning-free build,
      # and letting one through here would quietly erode that.
      - name: Build
        run: dotnet build FSOps.sln --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test FSOps.sln --no-build --configuration Release --verbosity normal

      - name: Install web dependencies
        working-directory: src/fsops-web
        run: npm ci

      - name: Type-check web
        working-directory: src/fsops-web
        run: npx tsc --noEmit

      # --deny-warnings for the same reason the .NET build uses -warnaserror, and it is not
      # optional: oxlint exits 0 with warnings on stdout, so a plain `npm run lint` step here would
      # go green with every warning it found and the linter would be running without ever being
      # able to fail. The web lint is currently clean; this is what keeps it that way.
      - name: Lint web
        working-directory: src/fsops-web
        run: npm run lint -- --deny-warnings

      - name: Test web
        working-directory: src/fsops-web
        run: npm run test:run

      - name: Build web
        working-directory: src/fsops-web
        run: npm run build
